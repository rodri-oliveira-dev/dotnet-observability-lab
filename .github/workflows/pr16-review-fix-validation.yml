name: PR 16 PostgreSQL diagnostic

on:
  push:
    branches:
      - feat/issue-3-postgres-redis

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Generate ephemeral validation credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "Parameters__postgres-password=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "Parameters__ingestion-db-password=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "Parameters__consolidation-db-password=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Restore and build AppHost
        run: |
          dotnet restore ./DotNetObservabilityLab.slnx
          dotnet build ./src/DotNetObservabilityLab.AppHost/DotNetObservabilityLab.AppHost.csproj

      - name: Diagnose PostgreSQL provisioning
        shell: bash
        run: |
          set -u

          dotnet run             --project ./src/DotNetObservabilityLab.AppHost/DotNetObservabilityLab.AppHost.csproj             --no-build > apphost.log 2>&1 &

          apphost_pid=$!
          trap 'kill "$apphost_pid" 2>/dev/null || true' EXIT

          sleep 25

          echo "===== APPHOST LOG ====="
          cat apphost.log || true

          echo "===== CONTAINERS ====="
          docker ps -a || true

          postgres_id="$(docker ps -a --format '{{.ID}} {{.Image}}' | awk '/postgres/ {print $1; exit}')"

          if [ -z "$postgres_id" ]; then
            echo "No PostgreSQL container found."
            exit 1
          fi

          echo "===== POSTGRES LOG ====="
          docker logs "$postgres_id" || true

          echo "===== POSTGRES ENV NAMES ====="
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$postgres_id" |
            sed -E 's/=.*/=<redacted>/' |
            sort || true

          admin_password="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$postgres_id" |
            sed -n 's/^POSTGRES_PASSWORD=//p')"

          echo "===== ROLES ====="
          docker exec -e PGPASSWORD="$admin_password" "$postgres_id"             psql -U postgres -Atc "SELECT rolname || ':' || rolsuper FROM pg_roles WHERE rolname IN ('ingestion_app', 'consolidation_app') ORDER BY rolname;" || true

          echo "===== DATABASES ====="
          docker exec -e PGPASSWORD="$admin_password" "$postgres_id"             psql -U postgres -Atc "SELECT datname || ':' || pg_get_userbyid(datdba) FROM pg_database ORDER BY datname;" || true
