name: Ingestion integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/adr/**'
      - 'docs/architecture/**'
      - '.agents/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'AGENTS.md'
      - 'Directory.*'
      - 'DotNetObservabilityLab.slnx'
      - 'global.json'
      - '.config/dotnet-tools.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET using global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify GitHub Actions use immutable pins
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(grep -R -n -E '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]#]+@' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$invalid" ]; then
            echo "::error::Found an action without a full commit-SHA pin:"
            echo "$invalid"
            exit 1
          fi

      - name: Restore
        run: dotnet restore ./DotNetObservabilityLab.slnx
      - name: Build
        run: dotnet build ./DotNetObservabilityLab.slnx --configuration Release --no-restore
      - name: PostgreSQL integration tests
        run: dotnet test ./tests/Ingestion.Api.Tests/Ingestion.Api.Tests.csproj --configuration Release --no-build
      - name: ADR Guard
        if: always()
        run: |
          dotnet tool restore
          dotnet tool run adr-guard check docs/adr
      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: LikeC4 validation
        if: always()
        run: |
          npm ci
          npm run architecture:validate
          npm run architecture:format:check
          npm run architecture:build
