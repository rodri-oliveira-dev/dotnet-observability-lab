name: Ingestion integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ingestion:
    name: Build, test, coverage and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET using global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify GitHub Actions use immutable pins
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(grep -R -n -E '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[^[:space:]#]+@' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$invalid" ]; then
            echo "::error::Found an action without a full commit-SHA pin:"
            echo "$invalid"
            exit 1
          fi
      - name: Restore architecture tools
        run: |
          dotnet tool restore
          npm ci
      - name: Check project dependency boundaries
        run: python3 scripts/check-architecture.py
      - name: ADR Guard
        run: dotnet tool run adr-guard check docs/adr
      - name: Check deterministic ADR index
        run: |
          dotnet tool run adr-guard index docs/adr
          git diff --exit-code -- docs/adr/README.md
      - name: Validate LikeC4 model and formatting
        run: |
          npm run architecture:validate
          npm run architecture:format:check
      - name: Build architecture documentation
        run: npm run architecture:build
      - name: Restore solution
        run: dotnet restore ./DotNetObservabilityLab.slnx
      - name: Build solution
        run: dotnet build ./DotNetObservabilityLab.slnx --configuration Release --no-restore
      - name: Test behavioral contracts and enforce 80% global line coverage
        run: bash scripts/test-with-coverage.sh
