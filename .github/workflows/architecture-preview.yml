name: Render and publish LikeC4 architecture

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/architecture/**'
      - 'README.md'
      - 'README.pt-BR.md'
      - 'docs/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_architecture_exports.py'
      - 'scripts/generate-architecture-markdown.sh'
      - '.github/workflows/architecture-preview.yml'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/**'
      - 'README.md'
      - 'README.pt-BR.md'
      - 'docs/README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_architecture_exports.py'
      - '.github/workflows/architecture-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Build site and seven LikeC4 views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked architecture dependencies
        run: npm ci
      - name: Validate architecture source and formatting
        run: |
          npm run architecture:validate
          npm run architecture:format:check
      - name: Build relocatable LikeC4 site
        run: npm run architecture:build
      - name: Check GitHub-rendered Mermaid is synchronized with LikeC4
        run: bash scripts/generate-architecture-markdown.sh --check
      - name: Install browser for locked Playwright exporter
        run: npx playwright install --with-deps chromium
      - name: Export seven views from the same LikeC4 model
        run: npm exec -- likec4 export png --flat -o dist/architecture-previews docs/architecture
      - name: Check view images and site assets
        run: python3 scripts/check_architecture_exports.py
      - name: Publish view images and navigable static site as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: likec4-rendered-architecture
          path: |
            dist/architecture/
            dist/architecture-previews/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/architecture/

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
