# Consolidate version updates from NuGet, SDK, npm, and GitHub Actions.
# Security updates follow Dependabot's own security update behavior.
version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    multi-ecosystem-group: "weekly-dependencies"
    patterns:
      - "*"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    multi-ecosystem-group: "weekly-dependencies"
    patterns:
      - "*"

  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "weekly-dependencies"
    patterns:
      - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "weekly-dependencies"
    patterns:
      - "*"
